# Builds the Android app with Google's official tools every time you push to main.
# Result: the "Artifacts" section of the run (Actions tab) holds
#   PlayAnywhere-<version>.aab   → upload this to the Play Console
#   PlayAnywhere-<version>.apk   → install this directly on a phone to try it
# Signing uses four repository secrets (Settings → Secrets and variables → Actions); see PLAYSTORE.md.
# Without them the run still succeeds and produces an unsigned-for-Play debug APK for testing.
name: Android app

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'store/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the game data, then copy the site into the app
        run: |
          node tools/validate-games.js
          node tools/validate-explainers.js
          node tools/sync-android.js
          echo "APP_VERSION=$(grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+' js/version.js)" >> "$GITHUB_ENV"

      - name: Prepare the upload key (only if the secrets are set)
        id: key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set, so only a debug APK is built. See PLAYSTORE.md, step 2."
          fi

      - name: Build the signed bundle (.aab) and test APK
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:bundleRelease :app:assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/bundle/release/app-release.aab "../dist/PlayAnywhere-${APP_VERSION}.aab"
          cp app/build/outputs/apk/release/app-release.apk "../dist/PlayAnywhere-${APP_VERSION}.apk"

      - name: Build a debug APK (no signing secrets)
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/PlayAnywhere-${APP_VERSION}-debug.apk"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload the app files
        uses: actions/upload-artifact@v4
        with:
          name: PlayAnywhere-${{ env.APP_VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
